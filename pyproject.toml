[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-bust"
version = "0.1.0"
description = "WeatherBench 2 data validation and smoke dataset pipeline"
requires-python = ">=3.11"
dependencies = [
  "dask[array]==2026.8.0",
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "gcsfs==2026.8.1",
  "geopandas==1.1.4",
  "numpy>=2.0,<3",
  "polars==1.44.2",
  "psutil>=7.0,<8",
  "pyarrow==25.0.1",
  "pyproj==3.7.2",
  "scipy==1.17.1",
  "scikit-learn==1.7.2",
  "shapely==2.1.2",
  "xgboost==3.0.5",
  "joblib==1.5.2",
  "httpx>=0.28,<1",
  "uvicorn>=0.35,<1",
  "xarray==2026.7.0",
  "zarr==2.18.7",
]

[project.optional-dependencies]
regrid = ["xesmf==0.9.2"]
dev = ["pytest>=8.0"]

[project.scripts]
forecast-bust = "forecast_bust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = '-ra -m "not cloud"'
testpaths = ["tests"]
markers = [
  "cloud: anonymous WeatherBench metadata access",
  "integration: local artifact or network integration test",
]
